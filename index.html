<!DOCTYPE html><html lang="en">
<head>

     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Announcement Poster</title>
  <!--link rel="icon" href="./res/tknp.png"/-->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }.poster {
  width: 350px;
  max-width: 90%;
  background: #ffffff;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  text-align: center;
}

.badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 50px;
  background: #2c5364;
  color: #fff;
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

h1 {
  font-size: 22px;
  margin: 10px 0;
  color: #203a43;
}

.subject {
  font-size: 26px;
  font-weight: bold;
  margin: 10px 0 20px;
  color: #0f2027;
}

.info {
  text-align: left;
  margin: 16px 0;
  font-size: 15px;
  color: #333;
}

.info div {
  margin-bottom: 10px;
}

.label {
  font-weight: bold;
  color: #203a43;
}

.time-box {
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  background: #f0f6f8;
  font-size: 18px;
  font-weight: bold;
  color: #2c5364;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #777;
}

@media print {
  body {
    background: none;
  }
}

  </style>
</head>
<body>
  <div class="poster" id="poster">
    <div class="badge">UPCOMING LESSON</div><h1>You're Invited</h1>
<div class="subject">CONDUIT SYSTEM INSTALLATION</div>

<div class="info">
  <div><span class="label">Trainer:</span> E16 - Kipkoech Abednego</div>
  <div><span class="label">Date:</span> 27 January 2026 - Tuesday</div>
  <div><span class="label">Duration:</span> 6 hrs</div>
  <div><span class="label">Class:</span> E Lab - Electrical Laboratory</div>
</div>

<div class="time-box">
  ⏰ 11:00 AM – 5:00 PM
</div>

<div class="footer">
  Be on time · Bring your notebook · From Class Rep. L6 - Derick
</div>

  </div>
</body>
</html>
